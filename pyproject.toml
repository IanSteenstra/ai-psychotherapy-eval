[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipsycheval"
version = "1.0.0"
description = "Evaluation framework for quality of care and risk in AI psychotherapy: simulated multi-session therapy with LLM-as-a-judge measures."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ian Steenstra" }]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.6",
    "duckdb>=1.1",
    "flask>=3.0",
    "google-genai>=2.0",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "openai>=1.40",
    "pandas>=2.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
characterai = ["PyCharacterAI>=2.2"]
dev = ["pytest>=8"]

[project.scripts]
aipsycheval = "aipsycheval.cli:main"

[project.urls]
Preprint = "https://arxiv.org/abs/2602.19948"
Dissertation = "https://www.proquest.com/docview/3285456546"

[tool.setuptools.packages.find]
include = ["aipsycheval*"]

[tool.setuptools.package-data]
aipsycheval = ["prompts/*.txt", "schemas/*.json", "data/*.csv", "dashboard/templates/*.html", "dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
